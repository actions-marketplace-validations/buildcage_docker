name: Example (inspect engine, audit mode)

on:
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # inspect decrypts, so it logs each request's method and full URL, and
      # the report's "Switch to restrict mode" section returns allowed_url_rules.
      - name: Start Buildcage builder
        uses: buildcage/docker@045eb32e2d0f2d6aea9506d057dca252cc1b2ce5 # v3.2.2
        with:
          proxy_mode: audit
          proxy_engine: inspect

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver: remote
          endpoint: docker-container://buildcage

      - name: Create test Dockerfile
        run: |
          mkdir -p /tmp/build-context
          cat <<'EOF' > /tmp/build-context/Dockerfile
          FROM node:24-bookworm-slim
          WORKDIR /app
          # Debian's archive is plain HTTP, so apt's rules are http:// URLs.
          RUN apt-get update && \
              apt-get install -y wget && \
              rm -rf /var/lib/apt/lists/*
          RUN npm init -y && npm install --ignore-scripts @hono/node-server
          EOF

      - name: Build test image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: /tmp/build-context
          push: false
          no-cache: true

      - name: Show proxy report
        if: always()
        uses: buildcage/docker/report@045eb32e2d0f2d6aea9506d057dca252cc1b2ce5 # v3.2.2
