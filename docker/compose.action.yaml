services:
  builder:
    container_name: ${BUILDER_NAME:-buildcage}
    image: ${BUILDCAGE_IMAGE_REF:-placeholder}
    # Not privileged, unlike docker/setup-buildx-action's own builder: these
    # three are all BuildKit needs, and device access and a writable host /proc
    # and /sys stay out.
    #
    # BuildKit OCI worker requires SYS_ADMIN for mount, namespaces, and cgroups.
    # iptables and CNI networking require NET_ADMIN.
    # runc needs SYS_PTRACE to access /proc/PID/ns/mnt for mount namespace setup.
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
      - SYS_PTRACE
    # AppArmor has to be off: docker-default refuses every mount regardless of
    # capabilities, and a replacement profile would have to be loaded into the
    # host kernel. Seccomp does not: builder.json is Docker's own default plus
    # what runc needs (see docker/seccomp/gen-profile.mjs).
    security_opt:
      - seccomp=./seccomp/builder.json
      - apparmor=unconfined
    # Pinned, not left to the daemon's default-cgroupns-mode: under `host` the
    # remount in each engine's init-cgroup would land on the host's own cgroup
    # tree.
    cgroup: private
    environment:
      - PROXY_MODE=${PROXY_MODE:-restrict}
      - ALLOWED_HTTPS_RULES=${ALLOWED_HTTPS_RULES:-}
      - ALLOWED_HTTP_RULES=${ALLOWED_HTTP_RULES:-}
      - ALLOWED_IP_RULES=${ALLOWED_IP_RULES:-}
      # inspect only: it is the one engine that can see a method or a path.
      - ALLOWED_URL_RULES=${ALLOWED_URL_RULES:-}
      - ALLOWED_TLS_RULES=${ALLOWED_TLS_RULES:-}
      - KNOWN_BLOCKED_RULES=${KNOWN_BLOCKED_RULES:-}
      - PROXY_ENGINE=${PROXY_ENGINE:-universal}
    # `--wait` would otherwise return on "running" alone, which says nothing
    # about buildkitd. buildctl works in all three engines. No restart policy
    # goes with it: a container that stopped itself has to stay stopped for the
    # wait to see it.
    healthcheck:
      test: ["CMD", "buildctl", "debug", "workers"]
      interval: 5s
      start_interval: 2s
      timeout: 10s
      retries: 3
      start_period: 120s
