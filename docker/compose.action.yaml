services:
  builder:
    container_name: ${BUILDER_NAME:-buildcage}
    image: ${BUILDCAGE_IMAGE_REF:-placeholder}
    # The builder has to mount, create namespaces and manage cgroups, which is
    # why docker/setup-buildx-action's own builder runs privileged. Granting
    # only the three capabilities that needs leaves out device access and a
    # writable host /proc and /sys.
    #
    # BuildKit OCI worker requires SYS_ADMIN for mount, namespaces, and cgroups.
    # iptables and CNI networking require NET_ADMIN.
    # runc needs SYS_PTRACE to access /proc/PID/ns/mnt for mount namespace setup.
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
      - SYS_PTRACE
    # docker-default refuses every mount regardless of capabilities, so it
    # cannot coexist with the SYS_ADMIN above, and a replacement profile would
    # have to be loaded into the host kernel. Seccomp needs no such escape
    # hatch: Docker's own default profile already allows mount, unshare and
    # setns to a SYS_ADMIN holder, so builder.json only adds what runc needs
    # beyond it (see docker/seccomp/gen-profile.mjs).
    #
    # No cgroup: host and no host cgroupfs mount either. The container keeps
    # its own cgroup namespace and remounts that namespace's /sys/fs/cgroup
    # read-write at startup, which is what BuildKit needs to make a cgroup per
    # RUN step (see each engine's init-cgroup).
    security_opt:
      - seccomp=./seccomp/builder.json
      - apparmor=unconfined
    environment:
      - PROXY_MODE=${PROXY_MODE:-restrict}
      - ALLOWED_HTTPS_RULES=${ALLOWED_HTTPS_RULES:-}
      - ALLOWED_HTTP_RULES=${ALLOWED_HTTP_RULES:-}
      - ALLOWED_IP_RULES=${ALLOWED_IP_RULES:-}
      # inspect only: it is the one engine that can see a method or a path.
      - ALLOWED_URL_RULES=${ALLOWED_URL_RULES:-}
      - ALLOWED_TLS_RULES=${ALLOWED_TLS_RULES:-}
      - KNOWN_BLOCKED_RULES=${KNOWN_BLOCKED_RULES:-}
      - PROXY_ENGINE=${PROXY_ENGINE:-universal}
    restart: unless-stopped
